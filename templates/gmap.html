<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0"/>
    <title>Accident Severity Prediction</title>

    <!-- Google Icons & Materialize CSS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
        }

        .nav-wrapper {
            padding: 0 20px;
        }

        .brand-logo {
            font-size: 1.8rem;
        }

        .nav-wrapper ul li {
            margin: 0 5px;
        }

        .nav-wrapper ul li a, .nav-wrapper ul li .btn-small {
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-small {
            background-color: #ff9800;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            text-align: center;
            font-weight: bold;
            line-height: normal;
            width: 200px;
            padding: 12px;
        }

        .btn-small:hover {
            background-color: #e68900;
        }

        .header {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 30px;
        }

        /* Full-width Map */
        .map-container {
            width: 100%;
            height: 80vh;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Button Grid */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .button-container form {
            margin: 0;
        }

    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar-fixed">
        <nav class="blue darken-3">
            <div class="nav-wrapper">
                <a href="/" class="brand-logo">Accident Severity Prediction</a>
                <ul class="right hide-on-med-and-down">
                    <li><a href="/Map">Maps</a></li>
                    <li><a href="/Graphs">Graphs</a></li>
                    <li><a href="/Pie">Pie Charts</a></li>
                    <li><a href="/wf">Weather Forecast</a></li>
                    <li><a href="/show">Prediction</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- Page Content -->
    <div class="container center-align">
        <h1 class="header orange-text">Accident Severity Prediction</h1>
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <a href="{{ url_for('city_prediction_page') }}" class="btn-small">Predict by City</a>
        <form action="/severity_input" method="get">
            <button type="submit" class="btn-small">Predict Severity</button>
        </form>
        <a href="/route_input" class="btn-small">Find Route</a>
    </div>

    <!-- Google Maps Embed -->
    <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d124372.74378325936!2d80.2553856!3d13.058048!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1701947375604!5m2!1sen!2sin"
        allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

</body>
</html>
