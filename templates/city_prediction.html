<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accident Severity Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fullscreen map */
        body {
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Input Box Styling */
        .input-box {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 18px;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        /* Map Styling */
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Input Box in Top Left -->
    <div class="input-box">
        <h2>Accident Severity Prediction</h2>
        <form action="{{ url_for('predict_city') }}" method="post">
            <input type="text" name="location" placeholder="Enter location" required>
            <button type="submit">Predict</button>
        </form>
    </div>

    <!-- Fullscreen Map -->
    {% if map_path %}
        <iframe src="{{ map_path }}"></iframe>
    {% else %}
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450942!2d144.95373531562323!3d-37.8162797420216!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d5df1dfef3f%3A0x9cbb79b12f5dbf9!2sMelbourne%20VIC%2C%20Australia!5e0!3m2!1sen!2sin!4v1633041658983!5m2!1sen!2sin"></iframe>
    {% endif %}

</body>
</html>
